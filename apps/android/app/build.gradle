plugins { id 'com.android.application' }
android {
  namespace 'dev.wellness.shell'
  compileSdk 37
  defaultConfig {
    applicationId 'dev.wellness.shell'
    minSdk 26
    targetSdk 37
    versionCode 1
    versionName '0.1'
  }
}

// The coach screen ships inside the APK: copy it from docs/mockups on every build (assets/web is git-ignored).
// Only what the app needs: no design notes images in full size, no demo data.
tasks.register('syncWeb', Sync) {
  from(file("$rootDir/../../docs/mockups")) { include 'floating-coach.html', 'app.js', 'img/web/**' }
  into "$projectDir/src/main/assets/web"
}
preBuild.dependsOn 'syncWeb'
